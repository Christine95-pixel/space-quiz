<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f5fb">
  <title>Orbit — Space Exploration Quiz</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      --page: #f4f5fb;
      --card: rgba(255, 255, 255, .88);
      --ink: #17182b;
      --muted: #74778e;
      --line: #e8e9f1;
      --accent: #6c5ce7;
      --accent-soft: #efedff;
      --correct: #137747;
      --correct-bg: #e9f8ef;
      --wrong: #b83245;
      --wrong-bg: #fff0f1;
      --shadow: 0 24px 70px rgba(35, 32, 83, .12), 0 3px 10px rgba(35, 32, 83, .04);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #11121c;
        --card: rgba(27, 28, 43, .94);
        --ink: #f3f1ff;
        --muted: #a4a4bd;
        --line: #38394c;
        --accent: #a398ff;
        --accent-soft: #302d50;
        --correct: #69d99d;
        --correct-bg: #193c30;
        --wrong: #ff8a96;
        --wrong-bg: #48292f;
        --shadow: 0 24px 70px rgba(0, 0, 0, .34), 0 3px 10px rgba(0, 0, 0, .15);
      }
    }

    * { box-sizing: border-box; }
    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      padding: 32px 18px;
      display: grid;
      place-items: center;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 18% 16%, rgba(178, 170, 255, .22), transparent 32%),
        radial-gradient(ellipse at 86% 84%, rgba(255, 190, 210, .2), transparent 30%),
        var(--page);
      font-size: 15px;
    }

    button { font: inherit; }
    .shell { width: min(100%, 480px); }
    .brand {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 9px;
      margin-bottom: 20px;
      font-size: 14px;
      font-weight: 750;
      letter-spacing: .13em;
      text-transform: uppercase;
    }
    .brand-mark {
      display: grid;
      width: 29px;
      height: 29px;
      place-items: center;
      border-radius: 10px;
      color: #fff;
      background: linear-gradient(145deg, #9d8fff, #6552df);
      box-shadow: 0 5px 14px rgba(108, 92, 231, .32);
      font-size: 16px;
    }
    .card {
      overflow: hidden;
      border: 1px solid color-mix(in srgb, var(--line), transparent 22%);
      border-radius: 24px;
      background: var(--card);
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
    }
    .card-inner { padding: 29px; }
    .topline {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 13px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 650;
    }
    .counter { color: var(--ink); }
    .score-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: color-mix(in srgb, var(--card), var(--page) 30%);
    }
    .score-value { color: var(--accent); font-weight: 750; font-variant-numeric: tabular-nums; }
    .progress-track {
      height: 7px;
      overflow: hidden;
      border-radius: 99px;
      background: var(--line);
    }
    .progress-fill {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #8b7aff, #5e52dc);
      transition: width .45s cubic-bezier(.2, .75, .3, 1);
    }
    .eyebrow {
      margin: 27px 0 8px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 750;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-size: clamp(23px, 6vw, 29px);
      line-height: 1.22;
      letter-spacing: -.045em;
    }
    .hint {
      margin: 10px 0 21px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }
    .answers { display: grid; gap: 10px; }
    .answer {
      position: relative;
      display: flex;
      min-height: 54px;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      border: 1px solid var(--line);
      border-radius: 14px;
      color: var(--ink);
      background: color-mix(in srgb, var(--card), var(--page) 25%);
      cursor: pointer;
      text-align: left;
      transition: transform .16s ease, border-color .16s ease, background .16s ease, box-shadow .16s ease;
    }
    .answer:hover:not(:disabled) {
      transform: translateY(-1px);
      border-color: color-mix(in srgb, var(--accent), var(--line) 45%);
      box-shadow: 0 5px 14px rgba(70, 60, 150, .08);
    }
    .answer:focus-visible, .primary:focus-visible, .text-button:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--accent), transparent 45%);
      outline-offset: 3px;
    }
    .answer:disabled { cursor: default; }
    .answer-letter {
      display: grid;
      flex: 0 0 29px;
      height: 29px;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 9px;
      color: var(--muted);
      background: var(--card);
      font-size: 12px;
      font-weight: 750;
    }
    .answer-text { flex: 1; font-size: 14px; font-weight: 570; line-height: 1.35; }
    .answer-mark { display: none; font-weight: 800; }
    .answer.is-correct {
      --answer-state: var(--correct);
      border-color: color-mix(in srgb, var(--correct), transparent 35%);
      color: var(--correct);
      background: var(--correct-bg);
      animation: pop .35s ease both;
    }
    .answer.is-wrong {
      --answer-state: var(--wrong);
      border-color: color-mix(in srgb, var(--wrong), transparent 35%);
      color: var(--wrong);
      background: var(--wrong-bg);
      animation: shake .38s ease both;
    }
    .answer.is-reveal {
      --answer-state: var(--correct);
      border-color: color-mix(in srgb, var(--correct), transparent 35%);
      color: var(--correct);
      background: var(--correct-bg);
    }
    .answer.is-correct,
    .answer.is-wrong,
    .answer.is-reveal {
      background-image:
        repeating-linear-gradient(0deg, transparent 0 8px, color-mix(in srgb, var(--answer-state), transparent 96%) 8px 9px),
        linear-gradient(90deg, color-mix(in srgb, var(--answer-state), transparent 92%), transparent 48%);
      box-shadow: inset 4px 0 var(--answer-state), 0 0 0 1px color-mix(in srgb, var(--answer-state), transparent 88%);
    }
    .answer.is-correct .answer-letter,
    .answer.is-wrong .answer-letter,
    .answer.is-reveal .answer-letter {
      border-color: color-mix(in srgb, var(--answer-state), transparent 58%);
      color: var(--answer-state);
      background: color-mix(in srgb, var(--answer-state), transparent 90%);
    }
    .answer.is-correct .answer-mark,
    .answer.is-wrong .answer-mark,
    .answer.is-reveal .answer-mark {
      display: grid;
      width: 27px;
      height: 27px;
      flex: 0 0 27px;
      place-items: center;
      border: 1px solid color-mix(in srgb, var(--answer-state), transparent 58%);
      border-radius: 8px;
      color: var(--answer-state);
      background: color-mix(in srgb, var(--answer-state), transparent 90%);
      line-height: 1;
    }

    .feedback {
      min-height: 25px;
      margin: 13px 1px 4px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }
    .feedback.good { color: var(--correct); font-weight: 650; }
    .feedback.bad { color: var(--wrong); font-weight: 650; }
    .actions {
      display: flex;
      min-height: 48px;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-top: 8px;
    }
    .microcopy { color: var(--muted); font-size: 12px; }
    .primary {
      min-height: 46px;
      padding: 0 18px;
      border: 0;
      border-radius: 13px;
      color: #fff;
      background: linear-gradient(135deg, #8071f4, #5f50db);
      box-shadow: 0 6px 14px rgba(102, 84, 224, .23);
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
      transition: transform .16s ease, box-shadow .16s ease;
    }
    .primary:hover { transform: translateY(-1px); box-shadow: 0 8px 18px rgba(102, 84, 224, .3); }
    .primary:active { transform: translateY(0); }
    .primary[hidden] { display: none; }
    .footer {
      margin: 18px 0 0;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }
    .result { padding: 38px 29px 31px; text-align: center; }
    .result-emoji {
      display: grid;
      width: 90px;
      height: 90px;
      place-items: center;
      margin: 0 auto 18px;
      border: 1px solid var(--line);
      border-radius: 28px;
      background: linear-gradient(145deg, var(--accent-soft), color-mix(in srgb, var(--card), var(--accent-soft) 40%));
      font-size: 48px;
      animation: float-in .55s cubic-bezier(.2, .8, .2, 1) both;
    }
    .result .eyebrow { margin: 0 0 8px; }
    .result h1 { font-size: 30px; }
    .result-copy { max-width: 340px; margin: 10px auto 21px; color: var(--muted); font-size: 14px; line-height: 1.55; }
    .result-score {
      display: inline-flex;
      min-width: 122px;
      flex-direction: column;
      gap: 2px;
      margin-bottom: 23px;
      padding: 13px 20px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: color-mix(in srgb, var(--card), var(--page) 28%);
    }
    .result-score strong { color: var(--accent); font-size: 25px; letter-spacing: -.04em; }
    .result-score span { color: var(--muted); font-size: 12px; }
    .result .primary { display: block; width: 100%; }
    .text-button {
      margin-top: 15px;
      padding: 6px 10px;
      border: 0;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
    }
    .text-button:hover { color: var(--accent); }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-5px); }
      40%, 80% { transform: translateX(5px); }
    }
    @keyframes pop {
      0% { transform: scale(.98); }
      65% { transform: scale(1.015); }
      100% { transform: scale(1); }
    }
    @keyframes float-in {
      from { opacity: 0; transform: translateY(10px) scale(.92); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
    @media (max-width: 420px) {
      body { padding: 22px 13px; }
      .card-inner { padding: 23px 19px; }
      .result { padding: 32px 21px 25px; }
      .answer { min-height: 52px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <div class="brand" aria-label="Orbit Space Quiz"><span class="brand-mark" aria-hidden="true">✦</span> Orbit</div>
    <section class="card" id="quiz-card" aria-label="Space exploration quiz">
      <div class="card-inner" id="quiz-view">
        <div class="topline">
          <span class="counter" id="question-counter">Question 1 of 10</span>
          <span class="score-pill" aria-label="Current score">✧ <span class="score-value" id="score">0</span><span>pts</span></span>
        </div>
        <div class="progress-track" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="10" aria-valuenow="0" id="progress">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
        <p class="eyebrow" id="category">Solar system</p>
        <h1 id="question" tabindex="-1"></h1>
        <p class="hint">Choose the best answer to continue your mission.</p>
        <div class="answers" id="answers"></div>
        <p class="feedback" id="feedback" aria-live="polite"></p>
        <div class="actions">
          <span class="microcopy" id="microcopy">One small step at a time.</span>
          <button class="primary" id="next-button" type="button" hidden>Next question <span aria-hidden="true">→</span></button>
        </div>
      </div>
      <div class="result" id="result-view" hidden aria-live="polite"></div>
    </section>
    <p class="footer">A little curiosity goes a long way. <span aria-hidden="true">✦</span></p>
  </main>

  <script>
    const questions = [
      { category: "Solar system", question: "Which planet is known as the Red Planet?", options: ["Venus", "Mars", "Mercury", "Jupiter"], answer: 1, fact: "Mars looks red because iron-rich dust covers much of its surface." },
      { category: "Our Moon", question: "What is the name of the first human-made object to reach the Moon?", options: ["Apollo 11", "Luna 2", "Voyager 1", "Sputnik 1"], answer: 1, fact: "The Soviet spacecraft Luna 2 reached the Moon in 1959." },
      { category: "The stars", question: "What is the closest star to Earth?", options: ["Sirius", "Proxima Centauri", "The Sun", "Alpha Centauri A"], answer: 2, fact: "The Sun is our nearest star, about 150 million kilometers away." },
      { category: "Space science", question: "What force keeps planets in orbit around the Sun?", options: ["Magnetism", "Gravity", "Friction", "Solar wind"], answer: 1, fact: "The Sun's gravity continually bends planets' paths into orbit." },
      { category: "Solar system", question: "Which planet has the most prominent ring system?", options: ["Neptune", "Saturn", "Uranus", "Jupiter"], answer: 1, fact: "Saturn's bright rings are made mostly of ice, with some rocky debris." },
      { category: "Deep space", question: "What is a galaxy?", options: ["A group of stars, gas, and dust held together by gravity", "A single bright star", "A planet with many moons", "A cloud inside Earth's atmosphere"], answer: 0, fact: "Galaxies contain stars, planets, gas, dust, and dark matter." },
      { category: "Space exploration", question: "Which telescope was launched into space in 2021 to study the early universe?", options: ["Hubble Space Telescope", "Kepler Space Telescope", "James Webb Space Telescope", "Chandra X-ray Observatory"], answer: 2, fact: "The James Webb Space Telescope observes the universe in infrared light." },
      { category: "Our Moon", question: "About how long does the Moon take to orbit Earth?", options: ["One day", "One week", "About one month", "One year"], answer: 2, fact: "One orbit takes about 27.3 days; its phases repeat about every 29.5 days." },
      { category: "Space science", question: "What is the boundary around a black hole beyond which light cannot escape called?", options: ["The event horizon", "The asteroid belt", "The photosphere", "The Kuiper line"], answer: 0, fact: "The event horizon marks the point of no return around a black hole." },
      { category: "Our cosmic home", question: "In which galaxy is our solar system located?", options: ["Andromeda", "Triangulum", "Whirlpool", "The Milky Way"], answer: 3, fact: "Our solar system is in the Milky Way's Orion Arm." }
    ];

    const quizView = document.getElementById("quiz-view");
    const resultView = document.getElementById("result-view");
    const counter = document.getElementById("question-counter");
    const scoreLabel = document.getElementById("score");
    const progress = document.getElementById("progress");
    const progressFill = document.getElementById("progress-fill");
    const category = document.getElementById("category");
    const questionTitle = document.getElementById("question");
    const answers = document.getElementById("answers");
    const feedback = document.getElementById("feedback");
    const nextButton = document.getElementById("next-button");
    const microcopy = document.getElementById("microcopy");
    let current = 0;
    let score = 0;
    let answered = false;

    function renderQuestion() {
      const item = questions[current];
      answered = false;
      counter.textContent = `Question ${current + 1} of ${questions.length}`;
      scoreLabel.textContent = score;
      progress.setAttribute("aria-valuenow", current);
      progressFill.style.width = `${(current / questions.length) * 100}%`;
      category.textContent = item.category;
      questionTitle.textContent = item.question;
      feedback.textContent = "";
      feedback.className = "feedback";
      microcopy.textContent = "One small step at a time.";
      nextButton.hidden = true;
      nextButton.innerHTML = current === questions.length - 1
        ? "See my results <span aria-hidden=\"true\">→</span>"
        : "Next question <span aria-hidden=\"true\">→</span>";
      answers.replaceChildren();

      item.options.forEach((option, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "answer";
        button.setAttribute("aria-label", `${String.fromCharCode(65 + index)}. ${option}`);
        button.innerHTML = `<span class="answer-letter" aria-hidden="true">${String.fromCharCode(65 + index)}</span><span class="answer-text"></span><span class="answer-mark" aria-hidden="true"></span>`;
        button.querySelector(".answer-text").textContent = option;
        button.addEventListener("click", () => selectAnswer(index, button));
        answers.append(button);
      });
    }

    function selectAnswer(index, selectedButton) {
      if (answered) return;
      answered = true;
      const item = questions[current];
      const buttons = [...answers.querySelectorAll(".answer")];
      buttons.forEach(button => { button.disabled = true; });
      if (index === item.answer) {
        score += 1;
        scoreLabel.textContent = score;
        selectedButton.classList.add("is-correct");
        selectedButton.querySelector(".answer-mark").textContent = "✓";
        feedback.textContent = `Brilliant! ${item.fact}`;
        feedback.classList.add("good");
      } else {
        selectedButton.classList.add("is-wrong");
        selectedButton.querySelector(".answer-mark").textContent = "×";
        const correctButton = buttons[item.answer];
        correctButton.classList.add("is-reveal");
        correctButton.querySelector(".answer-mark").textContent = "✓";
        feedback.textContent = `Not quite. ${item.fact}`;
        feedback.classList.add("bad");
      }
      microcopy.textContent = "Mission control says…";
      progress.setAttribute("aria-valuenow", current + 1);
      progressFill.style.width = `${((current + 1) / questions.length) * 100}%`;
      nextButton.hidden = false;
      nextButton.focus();
    }

    function showResults() {
      const percent = score / questions.length;
      const result = percent === 1
        ? { emoji: "🚀", title: "Out of this world!", copy: "A perfect mission. You really know your way around the cosmos." }
        : percent >= .7
          ? { emoji: "🌟", title: "Stellar work!", copy: "Your space smarts are shining bright. The universe is lucky to have you." }
          : percent >= .4
            ? { emoji: "🪐", title: "Nice orbit!", copy: "You found your way through the stars. There's always more to discover." }
            : { emoji: "🌙", title: "Keep looking up!", copy: "Every great explorer starts somewhere. Ready for another trip?" };
      quizView.hidden = true;
      resultView.hidden = false;
      resultView.innerHTML = `
        <div class="result-emoji" aria-hidden="true">${result.emoji}</div>
        <p class="eyebrow">Mission complete</p>
        <h1>${result.title}</h1>
        <p class="result-copy">${result.copy}</p>
        <div class="result-score"><strong>${score} / ${questions.length}</strong><span>correct answers</span></div>
        <button class="primary" id="restart-button" type="button">Explore again <span aria-hidden="true">↻</span></button>
        <button class="text-button" id="review-button" type="button">Start over from question 1</button>`;
      document.getElementById("restart-button").addEventListener("click", restartQuiz);
      document.getElementById("review-button").addEventListener("click", () => {
        current = 0;
        score = 0;
        resultView.hidden = true;
        quizView.hidden = false;
        renderQuestion();
        questionTitle.focus();
      });
      document.getElementById("restart-button").focus();
      progress.setAttribute("aria-valuenow", questions.length);
      progressFill.style.width = "100%";
    }

    function restartQuiz() {
      current = 0;
      score = 0;
      resultView.hidden = true;
      quizView.hidden = false;
      renderQuestion();
      questionTitle.focus();
    }

    nextButton.addEventListener("click", () => {
      if (!answered) return;
      if (current === questions.length - 1) {
        showResults();
      } else {
        current += 1;
        renderQuestion();
        questionTitle.focus();
      }
    });

    renderQuestion();
  </script>
</body>
</html>
